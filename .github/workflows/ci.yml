name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen swiftlint
      - run: make lint
      - run: make test
      - run: make app
      - uses: actions/upload-artifact@v4
        with:
          name: OnHand-local-preview
          path: dist/
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
