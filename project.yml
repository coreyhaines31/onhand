name: OnHand
options:
  bundleIdPrefix: com.onhandformac
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.2.0'
    CURRENT_PROJECT_VERSION: '5'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
packages:
  OnHandCore:
    path: .
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: '2.4.0'
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: '2.10.0'
targets:
  OnHand:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        excludes: [Info.plist]
        buildPhase: resources
    dependencies:
      - package: OnHandCore
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: OnHandCLI
        copy:
          destination: executables
        codeSignOnCopy: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: On Hand
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleIconFile: OnHand
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines
    settings:
      base:
        PRODUCT_NAME: On Hand
        PRODUCT_MODULE_NAME: OnHand
        PRODUCT_BUNDLE_IDENTIFIER: com.onhandformac.OnHand
        COMBINE_HIDPI_IMAGES: YES
  OnHandCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - package: OnHandCore
    settings:
      base:
        PRODUCT_NAME: onhand
        PRODUCT_BUNDLE_IDENTIFIER: com.onhandformac.OnHand.CLI
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
